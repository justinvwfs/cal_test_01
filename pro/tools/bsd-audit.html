<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>BSD 智慧覆核引擎 · Smart Audit Engine — Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
<script src="../../bsd-core.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--bg-white:#fff;--bg-card:rgba(255,255,255,.88);--bg-card-solid:#fff;--bg-frost:rgba(255,255,255,.65);--border:rgba(15,23,42,.07);--border-focus:#7c3aed;--text:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;--accent:#7c3aed;--accent-light:#f5f3ff;--accent2:#0d9488;--accent2-light:#f0fdfa;--gold:#d97706;--danger:#dc2626;--success:#059669;--warning:#d97706;--nav-dark:#0f1c2e;--radius:16px;--radius-sm:10px;--radius-xs:6px;--shadow-xs:0 1px 3px rgba(15,23,42,.04);--shadow-sm:0 2px 8px rgba(15,23,42,.05);--shadow:0 4px 20px rgba(15,23,42,.07);--shadow-lg:0 16px 48px rgba(15,23,42,.10);--font:'Plus Jakarta Sans','Noto Sans TC',sans-serif;--mono:'JetBrains Mono',monospace;--topbar-h:60px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-30%;right:-15%;width:700px;height:700px;background:radial-gradient(circle,rgba(124,58,237,.07),transparent 65%);pointer-events:none;z-index:0}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:100;height:var(--topbar-h);background:rgba(255,255,255,.92);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1200px;margin:0 auto;height:100%;display:flex;align-items:center;padding:0 20px;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:36px;height:36px;background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.28)}
.brand-name{font-weight:800;font-size:.95rem;letter-spacing:-.03em}
.brand-sub{font-size:9px;color:var(--text-muted);font-family:var(--mono);letter-spacing:.03em}
.topbar-end{margin-left:auto;display:flex;align-items:center;gap:8px}
.pro-badge{font-family:var(--mono);font-size:10px;color:#7c3aed;background:#f5f3ff;border:1px solid rgba(124,58,237,.2);padding:5px 14px;border-radius:50px;font-weight:700}
.back-link{font-size:11px;color:var(--text-muted);text-decoration:none;padding:6px 14px;border-radius:50px;border:1.5px solid var(--border);background:var(--bg-white);font-family:var(--mono);font-weight:700;transition:all .2s}
.back-link:hover{color:#7c3aed;border-color:rgba(124,58,237,.25)}

/* AUTH */
#auth-guard{position:fixed;inset:0;background:rgba(15,28,46,.9);backdrop-filter:blur(16px);z-index:9999;display:flex;align-items:center;justify-content:center}
.auth-msg{color:#fff;text-align:center;font-family:var(--font)}
.auth-msg a{color:#a78bfa;font-family:var(--mono);text-underline-offset:3px}

/* LAYOUT */
.wrap{max-width:1200px;margin:0 auto;padding:20px;position:relative;z-index:1}

/* GLASS CARD */
.glass-card{background:var(--bg-card);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow);transition:box-shadow .3s}
.glass-card:hover{box-shadow:var(--shadow-lg)}
.section-title{font-size:1rem;font-weight:800;color:var(--text);margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;letter-spacing:-.02em}
.title-block{display:flex;flex-direction:column;gap:2px}
.title-zh{font-size:1rem;font-weight:800}
.title-en{font-size:9px;font-weight:500;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}

/* AUDIT STYLES used by bsd-audit.js */
#audit-mount-point{min-height:200px}
.audit-config{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.audit-zone{border:2px dashed var(--border);border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;transition:all .3s;position:relative;background:var(--bg-frost)}
.audit-zone:hover,.audit-zone.drag-over{border-color:var(--accent);background:var(--accent-light)}
.audit-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}
.audit-zone-icon{font-size:2rem;margin-bottom:8px}
.audit-zone-text{font-size:13px;font-weight:700;color:var(--text)}
.audit-zone-hint{font-size:11px;color:var(--text-muted);margin-top:4px}
.audit-col-select{width:100%;padding:8px;border-radius:7px;border:1px solid var(--border);background:var(--bg-white);color:var(--text);font-size:12px}
.audit-range-row{display:flex;gap:8px;align-items:center}
.audit-range-row span{color:var(--text-muted)}
.bypass-check-wrap{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;padding:10px 14px;background:#fffbeb;border-radius:8px;border:1px solid rgba(217,119,6,.18)}
.bypass-check-wrap label{font-size:12px;font-weight:700;color:#92400e;cursor:pointer}
.audit-instructions{margin-bottom:14px}
.audit-instructions summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--text-secondary);padding:6px 0}
.inst-body{padding:12px;background:var(--bg);border-radius:7px;font-size:12px;color:var(--text-secondary);line-height:1.8}
.inst-step{margin-bottom:6px}
.inst-tag{background:#f5f3ff;color:#5b21b6;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.audit-conflict-alert{display:none;background:#fef2f2;border:1px solid rgba(220,38,38,.18);border-radius:9px;padding:12px;margin-bottom:14px}
.alert-title{font-weight:900;color:var(--danger);font-size:13px;margin-bottom:4px}
.alert-body{font-size:12px;color:var(--text-secondary)}
.audit-two-col{display:grid;grid-template-columns:240px 1fr;gap:14px}
.audit-info-sidebar h4{color:#5b21b6;margin-bottom:10px;font-size:14px}
.manual-entry-area{padding:14px;background:var(--bg);border-radius:10px;border:1px solid var(--border)}
.manual-phase-row{display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:12px;color:var(--text-secondary)}
.manual-phase-row input{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg-white);color:var(--text);font-family:var(--mono);font-size:12px}
.ocr-progress{display:none;padding:15px;text-align:center}
.ocr-bar{height:5px;background:var(--bg);border-radius:3px;margin-top:8px;overflow:hidden}
.ocr-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#5b21b6,#7c3aed);border-radius:3px;transition:width .3s}
.audit-preview{margin-bottom:15px}
.audit-summary-bar{margin-bottom:20px}
.sf-table-container{overflow-x:auto;border-radius:11px;border:1px solid var(--border);max-height:560px;background:var(--bg-white)}
.sf-table{width:100%;border-collapse:collapse;font-size:12px;text-align:center;white-space:nowrap}
.sf-table th{padding:11px 10px;background:var(--nav-dark);color:rgba(255,255,255,.78);position:sticky;top:0;z-index:10;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.sf-table td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text-secondary);font-family:var(--mono);font-size:12px}
.sf-table tr:hover td{background:rgba(124,58,237,.025)}
.input-group{margin-bottom:11px}
.input-group label{display:flex;align-items:baseline;gap:4px;font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:5px}
.input-group input,.input-group select{width:100%;padding:10px 12px;border-radius:var(--radius-xs);border:1.5px solid var(--border);background:var(--bg-white);font-size:14px;font-weight:700;font-family:var(--mono);color:var(--text);transition:all .2s;outline:none}
.input-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.09)}
.btn{cursor:pointer;border:none;font-family:var(--font);font-weight:700;border-radius:var(--radius-xs);touch-action:manipulation;transition:all .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-audit-run{background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;padding:13px;font-size:14px;width:100%;margin-bottom:10px;border-radius:12px;box-shadow:0 4px 16px rgba(91,33,182,.24)}
.btn-audit-clear{background:var(--bg);color:var(--text-muted);padding:10px;width:100%;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:13px}
.btn-excel{background:#14532d;color:#fff;padding:7px 13px;font-size:11px;display:inline-flex;align-items:center;gap:4px;border-radius:7px}
.btn-pdf{background:#7f1d1d;color:#fff;padding:7px 13px;font-size:11px;display:inline-flex;align-items:center;gap:4px;border-radius:7px}
.btn-del{background:var(--danger);color:#fff;font-size:11px;padding:4px 9px;border-radius:5px}
.btn-rev{background:var(--warning);color:#fff;font-size:11px;padding:3px 8px;border-radius:4px;margin-top:4px}

@media(max-width:768px){.audit-two-col{grid-template-columns:1fr}}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(15,23,42,.1);border-radius:3px}
</style>
</head>
<body>

<div id="auth-guard">
  <div class="auth-msg">
    <div style="font-size:2rem;margin-bottom:12px">🔐</div>
    <div>驗證中… Authenticating…</div>
  </div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo">🔍</div>
      <div>
        <div class="brand-name">智慧覆核引擎</div>
        <div class="brand-sub">Smart Audit Engine v5.0 — Pro</div>
      </div>
    </div>
    <div class="topbar-end">
      <span class="pro-badge">PRO · BSD</span>
      <a class="back-link" href="../index.html">← 工具列表 Tools</a>
    </div>
  </div>
</header>

<div class="wrap" id="page-content" style="display:none">
  <div id="audit-mount-point">
    <div class="glass-card" style="text-align:center;padding:60px 40px">
      <div style="font-size:2rem;margin-bottom:12px">🔍</div>
      <p style="color:var(--text-secondary)">載入智慧覆核引擎… Loading Smart Audit Engine…</p>
    </div>
  </div>
</div>

<script>
(function(){
  if(sessionStorage.getItem('bsd_pro_auth')!=='1'){
    document.getElementById('auth-guard').innerHTML=
      '<div class="auth-msg">'+
      '<div style="font-size:2rem;margin-bottom:12px">🔐</div>'+
      '<div style="margin-bottom:16px">請先通過專業版驗證<br><span style="font-size:12px;opacity:.6">Authorization required</span></div>'+
      '<a href="../index.html">← 前往登入 · Go to Login</a>'+
      '</div>';
  }else{
    document.getElementById('auth-guard').style.display='none';
    document.getElementById('page-content').style.display='block';
    loadAudit();
  }
})();

window.switchView=function(v){if(v==='single')window.location.href='../index.html';};

function loadAudit(){
  var s=document.createElement('script');
  s.src='../modules/bsd-audit.js';
  s.onload=function(){if(typeof initAudit==='function')initAudit();};
  s.onerror=function(){
    document.getElementById('audit-mount-point').innerHTML=
      '<div class="glass-card" style="text-align:center;padding:40px;color:var(--danger)">'+
      '⚠️ 模組載入失敗，請確認 bsd-audit.js 路徑正確。<br>'+
      '<span style="font-size:12px;opacity:.7">Module load failed — check bsd-audit.js path.</span>'+
      '</div>';
  };
  document.head.appendChild(s);
}
</script>
</body>
</html>
